<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 둘만의 편지함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#4a2e44;
    --plum-deep:#2f1c2b;
    --blush:#f7d9de;
    --blush-soft:#fbe9ec;
    --gold:#d9a066;
    --lavender:#d9c9e8;
    --cream:#fff8f3;
    --ink:#3d2a37;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:'Gowun Dodum', sans-serif;
    background:
      radial-gradient(circle at 20% 20%, #f9e3e6 0%, transparent 45%),
      radial-gradient(circle at 80% 75%, #e6d6ef 0%, transparent 50%),
      linear-gradient(160deg, #fdf3f0 0%, #f6e6ee 55%, #ece0f2 100%);
    color:var(--ink);
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* 떠다니는 하트 배경 */
  .floaters{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .floaters span{
    position:absolute;
    bottom:-10%;
    font-size:18px;
    color:var(--blush);
    opacity:.55;
    animation:rise linear infinite;
    filter:drop-shadow(0 0 6px rgba(217,160,102,.15));
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.5; }
    100%{ transform:translateY(-115vh) translateX(20px) rotate(25deg); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:1;
    width:min(420px, 90vw);
    text-align:center;
  }

  .eyebrow{
    font-family:'Gowun Batang', serif;
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.35em;
    color:var(--gold);
    margin-bottom:10px;
  }

  h1{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size:clamp(29px, 6.8vw, 38px);
    color:var(--plum);
    margin:0 0 6px;
    line-height:1.35;
  }
  h1 .heart-glyph{
    display:inline-block;
    color:var(--gold);
  }

  .sub{
    font-size:15.5px;
    font-weight:500;
    color:#6b5568;
    margin:0 0 34px;
    line-height:1.65;
  }

  .intro-block{
    margin-bottom:0;
  }

  /* 편지봉투 + 밀랍 인장 (시그니처 요소) */
  .envelope-wrap{
    position:relative;
    width:232px;
    height:158px;
    margin:0 auto 8px;
    transition:margin-top .5s ease;
  }
  .stage.unlocked .envelope-wrap{
    margin-top:-16px;
  }
  .envelope{
    position:absolute; inset:0;
    background:linear-gradient(160deg, #fffaf6, #fbeee6);
    border-radius:10px;
    box-shadow:
      0 18px 40px -14px rgba(74,46,68,.35),
      inset 0 0 0 1px rgba(217,160,102,.25);
    overflow:hidden;
  }
  .envelope::before{ /* 편지지 살짝 보이는 느낌 */
    content:"";
    position:absolute;
    left:14px; right:14px; top:14px;
    height:60%;
    background:repeating-linear-gradient(
      to bottom,
      transparent, transparent 13px, rgba(217,160,102,.12) 14px
    );
    border-radius:4px;
  }
  .flap{
    position:absolute;
    top:0; left:0; right:0;
    height:78px;
    background:linear-gradient(150deg, var(--blush-soft), var(--lavender));
    clip-path:polygon(0 0, 100% 0, 50% 68%);
    transform-origin:top center;
    transition:transform 1.1s cubic-bezier(.4,1.6,.5,1), box-shadow .6s ease;
    box-shadow: inset 0 -6px 10px -4px rgba(74,46,68,.15);
  }
  .stage.unlocked .flap{
    transform:rotateX(160deg) translateY(-2px);
  }

  .seal{
    position:absolute;
    top:64px; left:50%;
    transform:translate(-50%,0);
    width:52px; height:52px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e6b27c, var(--gold) 60%, #b9713a 100%);
    box-shadow:0 6px 14px -4px rgba(185,113,58,.6), inset 0 0 0 2px rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center;
    z-index:2;
    transition:transform .6s ease, opacity .6s ease;
  }
  .seal svg{ width:24px; height:24px; }
  .stage.unlocked .seal{
    transform:translate(-50%,0) scale(0);
    opacity:0;
  }

  .letter-peek{
    position:absolute;
    top:26px; left:50%;
    transform:translate(-50%,20px);
    width:184px;
    padding:15px 17px;
    background:var(--cream);
    border-radius:6px;
    font-family:'Gowun Batang', serif;
    font-size:14px;
    font-weight:700;
    color:var(--plum);
    line-height:1.5;
    opacity:0;
    box-shadow:0 10px 24px -10px rgba(74,46,68,.3);
    transition:opacity .5s ease .5s, transform .7s cubic-bezier(.3,1.4,.5,1) .5s;
    z-index:1;
  }
  .stage.unlocked .letter-peek{
    opacity:1;
    transform:translate(-50%,-26px);
  }

  form{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
  }

  .pw-field{
    position:relative;
    width:100%;
  }
  input[type="password"]{
    width:100%;
    padding:14px 44px 14px 18px;
    border-radius:999px;
    border:1.5px solid rgba(217,160,102,.4);
    background:rgba(255,255,255,.7);
    font-family:'Gowun Dodum', sans-serif;
    font-size:17px;
    letter-spacing:4px;
    color:var(--plum);
    outline:none;
    text-align:center;
    transition:border-color .3s, box-shadow .3s;
  }
  input[type="password"]::placeholder{
    letter-spacing:normal;
    color:#c3aebc;
  }
  input[type="password"]:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(217,160,102,.15);
  }

  button{
    padding:13px 34px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg, var(--gold), #cf8c58);
    color:#fff8f0;
    font-family:'Gowun Batang', serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:.05em;
    cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(185,113,58,.55);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  button:hover{ transform:translateY(-2px); box-shadow:0 14px 24px -8px rgba(185,113,58,.6); }
  button:active{ transform:translateY(0); }

  .message{
    min-height:20px;
    font-size:14px;
    font-weight:600;
    color:#c76b7a;
    transition:opacity .3s;
  }
  .message.success{ color:#7a8f5e; }

  .shake{ animation:shake .45s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(4px); }
  }

  .go{
    display:inline-block;
    margin-top:14px;
    font-family:'Gowun Batang', serif;
    font-size:15.5px;
    font-weight:700;
    color:#fff8f0;
    text-decoration:none;
    background:linear-gradient(135deg, var(--gold), #cf8c58);
    padding:12px 32px;
    border-radius:999px;
    box-shadow:0 10px 22px -8px rgba(185,113,58,.55);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .5s ease .3s, transform .5s ease .3s, box-shadow .2s ease;
    animation:go-pulse 2.2s ease-in-out infinite;
  }
  .go:hover{
    box-shadow:0 14px 26px -8px rgba(185,113,58,.65);
    transform:translateY(-2px);
  }
  .stage.unlocked .go{
    opacity:1;
    transform:translateY(0);
  }
  @keyframes go-pulse{
    0%, 100%{ box-shadow:0 10px 22px -8px rgba(185,113,58,.55); }
    50%{ box-shadow:0 10px 26px -6px rgba(185,113,58,.8); }
  }

  .guest-btn{
    position:fixed;
    bottom:52px; left:50%; transform:translateX(-50%);
    z-index:2;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px; font-weight:700;
    color:var(--plum);
    background:rgba(255,255,255,.65);
    border:1.5px solid rgba(217,160,102,.4);
    padding:11px 26px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 18px -8px rgba(74,46,68,.25);
    transition:all .2s ease;
  }
  .guest-btn:hover{
    background:#fff;
    transform:translateX(-50%) translateY(-2px);
  }

  footer{
    position:fixed;
    bottom:16px; left:0; right:0;
    text-align:center;
    font-size:12.5px;
    font-weight:600;
    color:#9b7aa8;
    letter-spacing:.1em;
    z-index:1;
  }
</style>
</head>
<body>

<div class="floaters" id="floaters"></div>

<div class="stage" id="stage">
  <div class="intro-block">
    <p class="eyebrow">WS &amp; SH</p>
    <h1>우리 둘만 아는<br>암호로 <span class="heart-glyph">♥</span> 열어줘</h1>
    <p class="sub">이 안에는 너에게만 보여주고 싶은<br>이야기들이 담겨 있어</p>
  </div>

  <div class="envelope-wrap">
    <div class="envelope">
      <div class="letter-peek">보고싶었어,<br>오늘 하루도 수고했어 :)</div>
    </div>
    <div class="flap"></div>
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 21s-7.5-4.8-10-9.3C.6 8.1 2.4 4.5 6 4.1c2-.2 3.7.9 6 3.4 2.3-2.5 4-3.6 6-3.4 3.6.4 5.4 4 4 7.6C19.5 16.2 12 21 12 21z" fill="#fff8f0" opacity=".9"/>
      </svg>
    </div>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="pw-field">
      <input type="password" id="pwInput" placeholder="· · · ·" maxlength="12" inputmode="numeric" required>
    </div>
    <button type="submit">열어보기</button>
    <p class="message" id="msg">&nbsp;</p>
    <a href="#" class="go" id="goLink">들어가기 →</a>
  </form>
</div>

<button class="guest-btn" onclick="guestEnter()">👋 게스트로 입장하기</button>

<footer>only for you, 이성화 🤍<br>only for you, 심우승 🤍</footer>

<script>
(function(){
  // ------------------------------------------------------------------
  // 잠금 해제 신호 저장 규칙 (하위 페이지 공통 지침)
  //
  // - 로그인 성공 시 sessionStorage 에 아래 키를 저장한다.
  //     key : "shim627_unlocked"
  //     val : "1"
  // - sessionStorage 는 "브라우저 탭/창을 완전히 닫기 전까지" 유지되므로
  //   지침에서 요구하는 "브라우저를 끌 때까지 로그인 신호 유지" 조건과 일치한다.
  // - 하위 페이지(개별 잠긴 페이지)는 로드 시 아래 스니펫을 최상단에 넣어
  //   신호를 확인하고, 없으면 index.html 로 되돌려보낸다.
  //
  //   [스크립트 시작]
  //   if (sessionStorage.getItem('shim627_unlocked') !== '1') {
  //     location.href = '/index.html'; // 경로는 실제 배포 구조에 맞게 조정
  //   }
  //   [스크립트 끝]
  //
  // - 보안키(패스워드)는 하드코딩된 "260904" 하나만 사용한다 (아이디 없음).
  // - 이 구조는 완전한 서버 보안이 아니라, 정적 페이지용 가벼운 잠금장치임.
  // ------------------------------------------------------------------

  var PASSWORD = "260904";
  var STORAGE_KEY = "shim627_unlocked";
  var ROLE_KEY = "shim627_role";
  var NEXT_PAGE = "main/home.html";
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzILmO8_ZO025q6JuZ0ojZ_gF68Kz8bsM3aCCZk2EUQ3XN_sbQsbKvYlDeGMgjIYVRr2w/exec';

  function fetchPublicIP() {
    return fetch('https://api.ipify.org?format=json')
      .then(function(r){ return r.json(); })
      .then(function(d){ return d.ip || ''; })
      .catch(function(){ return ''; });
  }

  function logVisit(role) {
    return fetchPublicIP().then(function(ip){
      return fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'logVisit', role: role, ip: ip }) }).catch(function(){});
    });
  }

  window.guestEnter = function() {
    sessionStorage.setItem(STORAGE_KEY, '1');
    sessionStorage.setItem(ROLE_KEY, 'guest');
    logVisit('guest').then(function(){
      window.location.href = NEXT_PAGE;
    }).catch(function(){
      window.location.href = NEXT_PAGE;
    });
  };

  var form = document.getElementById('loginForm');
  var input = document.getElementById('pwInput');
  var msg = document.getElementById('msg');
  var stage = document.getElementById('stage');
  var goLink = document.getElementById('goLink');

  // 이미 이 세션에서 열어본 적 있다면 바로 다음 장면 보여주기
  if (sessionStorage.getItem(STORAGE_KEY) === '1') {
    stage.classList.add('unlocked');
    msg.textContent = "이미 열려있는 편지야, 어서 들어와 :)";
    msg.classList.add('success');
  }

  goLink.addEventListener('click', function(e){
    e.preventDefault();
    window.location.href = NEXT_PAGE;
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var val = input.value.trim();

    if (val === PASSWORD) {
      sessionStorage.setItem(STORAGE_KEY, '1');
      sessionStorage.setItem(ROLE_KEY, 'owner');
      logVisit('owner');
      stage.classList.add('unlocked');
      msg.textContent = "편지가 열렸어 ♥";
      msg.classList.add('success');
      input.blur();
    } else {
      msg.classList.remove('success');
      msg.textContent = "음... 그 암호는 아닌 것 같은데?";
      stage.classList.remove('shake');
      void stage.offsetWidth; // reflow to restart animation
      stage.classList.add('shake');
      input.value = '';
      input.focus();
    }
  });

  // 배경 하트 생성
  var wrap = document.getElementById('floaters');
  var glyphs = ['♥','❀','♡'];
  var count = 16;
  for (var i=0; i<count; i++){
    var s = document.createElement('span');
    s.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    s.style.left = (Math.random()*100) + 'vw';
    s.style.fontSize = (12 + Math.random()*14) + 'px';
    s.style.animationDuration = (10 + Math.random()*10) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    wrap.appendChild(s);
  }
})();
</script>

</body>
</html>
