<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버킷리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --plum:#3d2a37; --plum-deep:#2f1c2b;
  --blush:#f7d9de; --blush-soft:#fbe9ec;
  --gold:#d9a066; --gold-dim:rgba(217,160,102,.14);
  --lavender:#d9c9e8; --cream:#fff8f3;
  --ink:#3d2a37; --ink-soft:#6b5568;
  --border:rgba(217,160,102,.22); --border2:rgba(217,160,102,.4);
  --red:#c76b7a; --green:#7a8f5e; --blue:#6f9fd8;
  --sidebar-w:230px;
  --font-serif:'Gowun Batang', serif;
  --font-body:'Gowun Dodum', sans-serif;
}
html,body{
  width:100%; height:100vh; overflow:hidden;
  font-family:var(--font-body); color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%, #f9e3e6 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, #e6d6ef 0%, transparent 50%),
    linear-gradient(160deg, #fdf3f0 0%, #f6e6ee 55%, #ece0f2 100%);
}
::-webkit-scrollbar{ width:6px; }
::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:3px; }

#rpWrap{ display:flex; height:100vh; overflow:hidden; }

#rpSidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:rgba(255,255,255,.55); backdrop-filter:blur(6px);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100vh; overflow-y:auto;
}
.rps-brand{ display:flex; align-items:center; gap:10px; padding:22px 18px 18px; border-bottom:1px solid var(--border); }
.rps-brand-icon{ font-size:24px; }
.rps-brand-name{ font-family:var(--font-serif); font-size:15.5px; font-weight:700; color:var(--plum); }
.rps-brand-sub{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-top:2px; }

.rps-nav{ padding:14px 0 20px; flex:1; }
.nav-home-item{ display:flex; align-items:center; gap:10px; padding:11px 16px; margin:0 10px 10px; border-radius:12px; cursor:pointer; transition:all .15s; font-size:14.5px; font-weight:600; color:var(--ink); text-decoration:none; }
.nav-home-item:hover{ background:rgba(255,255,255,.6); }
.nav-home-item.active{ background:var(--gold-dim); color:var(--plum); border:1px solid var(--border2); }
.nav-home-item.home-link{ background:var(--blush-soft); border:1px solid var(--border2); }
.nav-home-item.home-link:hover{ background:var(--blush); }

.rps-footer{ padding:14px 18px; border-top:1px solid var(--border); font-size:12px; font-weight:600; color:var(--ink-soft); }

#rpMain{ flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; min-width:0; }
#statusBar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 26px; height:44px; background:rgba(255,255,255,.5); border-bottom:1px solid var(--border); }
.sb-left{ display:flex; align-items:center; gap:10px; }
.sb-brand{ font-family:var(--font-serif); font-size:14.5px; font-weight:700; color:var(--plum); }
.sb-dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); animation:pulse-dot 2s infinite; }
@keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.sb-crumb{ font-size:13px; font-weight:600; color:var(--ink-soft); }
.sb-right{ font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:14px; }
.sb-badge{ font-size:11.5px; font-weight:700; background:var(--gold-dim); color:var(--plum); padding:4px 10px; border-radius:999px; border:1px solid var(--border2); }

#contentWrap{ flex:1; overflow-y:auto; }
#mainWrap{ padding:34px 40px 60px; max-width:none; width:100%; margin:0 auto; }

.hero{ text-align:center; margin-bottom:22px; }
.hero .eyebrow{ font-family:var(--font-serif); font-size:14px; font-weight:700; color:var(--gold); letter-spacing:.3em; margin-bottom:8px; }
.hero h1{ font-family:var(--font-serif); font-size:26px; font-weight:700; color:var(--plum); margin-bottom:8px; }
.hero .desc{ font-size:15px; font-weight:600; color:var(--ink-soft); line-height:1.7; }

.toolbar{ display:flex; gap:10px; align-items:center; justify-content:center; margin-bottom:26px; flex-wrap:wrap; }
.search-wrap{ position:relative; flex:0 1 320px; }
.search-wrap input{
  width:100%; padding:11px 16px 11px 38px; border-radius:999px; border:1px solid var(--border2);
  background:rgba(255,255,255,.7); font-family:var(--font-body); font-size:14px; color:var(--ink); outline:none;
}
.search-wrap .icon{ position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.6; }
.add-btn{
  font-family:var(--font-serif); font-size:15px; font-weight:700; color:#fff8f0;
  background:linear-gradient(135deg, var(--gold), #cf8c58);
  padding:11px 26px; border-radius:999px; border:none; cursor:pointer;
  box-shadow:0 10px 22px -8px rgba(185,113,58,.55); white-space:nowrap;
}

.items{ display:grid; grid-template-columns:repeat(4, 1fr); gap:20px; }
@media (max-width: 1400px){ .items{ grid-template-columns:repeat(3, 1fr); } }
@media (max-width: 1020px){ .items{ grid-template-columns:repeat(2, 1fr); } }
@media (max-width: 620px){ .items{ grid-template-columns:1fr; } }

.tag-filter-bar{ display:flex; gap:7px; align-items:center; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
.tag-chip{
  font-size:12.5px; font-weight:600; padding:6px 14px; border-radius:999px;
  border:1px solid var(--border2); background:rgba(255,255,255,.5); color:var(--ink-soft); cursor:pointer; transition:all .15s;
}
.tag-chip:hover{ background:rgba(255,255,255,.8); }
.tag-chip.active{ background:var(--gold-dim); color:var(--plum); border-color:var(--gold); font-weight:700; }

/* 태그 피커 (모달 내 클릭식 선택기) */
.tag-picker{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.tag-picker-chip{
  font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:999px;
  border:1.5px solid var(--border2); background:rgba(255,255,255,.5); color:var(--ink-soft); cursor:pointer; transition:all .15s;
}
.tag-picker-chip.selected{ background:linear-gradient(135deg, var(--gold), #cf8c58); color:#fff8f0; border-color:transparent; font-weight:700; }
.tag-new-btn{
  font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px;
  border:1.5px dashed var(--border2); background:transparent; color:var(--gold); cursor:pointer;
}
.tag-new-input-wrap{ display:flex; gap:6px; margin-top:8px; width:100%; }
.tag-new-input-wrap input{ flex:1; padding:8px 12px; border-radius:999px; border:1px solid var(--border2); font-size:12.5px; outline:none; }
.tag-new-input-wrap button{ font-size:12px; font-weight:700; padding:8px 14px; border-radius:999px; border:none; background:var(--plum); color:#fff; cursor:pointer; }

/* 완료 카드 */
.item-card.completed{ background:rgba(150,190,150,.22); border-color:rgba(122,143,94,.35); }
.icon-btn.done-btn.active{ background:rgba(122,143,94,.25); color:#4f6a3a; border-color:rgba(122,143,94,.4); }

/* ---------- 통계 패널 ---------- */
.bl-top-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:stretch; margin-bottom:26px; }
.bl-stats-row{ display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
.bl-header-card{
  background:rgba(255,255,255,.5); border:1px solid var(--border); border-radius:18px;
  padding:22px 20px; display:flex; flex-direction:column; justify-content:center;
}
.bl-header-card .eyebrow{ text-align:left; margin-bottom:6px; }
.bl-header-card h1{ text-align:left; font-size:21px; margin-bottom:6px; }
.bl-header-card .desc{ text-align:left; font-size:12.5px; margin-bottom:14px; }
@media (max-width: 1300px){
  .bl-top-row{ grid-template-columns:1fr; }
  .bl-stats-row{ grid-template-columns:repeat(3, 1fr); }
}
@media (max-width: 700px){
  .bl-stats-row{ grid-template-columns:1fr; }
}
.stat-card{
  background:rgba(255,255,255,.55); border:1px solid var(--border); border-radius:16px;
  padding:18px; box-shadow:0 10px 22px -14px rgba(74,46,68,.25);
}
.stat-title{ font-family:var(--font-serif); font-size:14px; font-weight:700; color:var(--plum); margin-bottom:12px; }
.donut-wrap{ display:flex; align-items:center; gap:16px; }
.donut-pct{ font-family:var(--font-serif); font-size:22px; font-weight:700; color:var(--plum); }
.donut-label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
.bar-chart{ display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px; }
.bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.bar-stack{ width:100%; max-width:26px; display:flex; flex-direction:column-reverse; border-radius:4px; overflow:hidden; }
.bar-seg-online{ background:var(--blue, #6f9fd8); }
.bar-seg-offline{ background:var(--gold); }
.bar-month-label{ font-size:9.5px; color:var(--ink-soft); margin-top:6px; font-weight:600; }
.bar-legend{ display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--ink-soft); justify-content:center; }
.bar-legend span{ display:inline-flex; align-items:center; gap:5px; }
.bar-legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; }

.item-tags{ display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:8px; }
.tag-pill{
  font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px;
  background:rgba(217,160,102,.15); color:var(--plum);
}
.tag-add-btn{
  font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:999px;
  border:1px dashed var(--border2); background:transparent; color:var(--ink-soft); cursor:pointer;
}
.tag-add-btn:hover{ background:rgba(255,255,255,.6); }

.item-card{
  background:rgba(255,255,255,.55); border:1px solid var(--border); border-radius:17px;
  padding:17px; box-shadow:0 12px 26px -16px rgba(74,46,68,.3); position:relative;
}
.item-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:9px; }
.item-title{ font-family:var(--font-serif); font-size:15.5px; font-weight:700; color:var(--plum); line-height:1.4; }
.item-actions{ display:flex; gap:6px; flex-shrink:0; }
.icon-btn{ font-size:12.5px; padding:5px 8px; border-radius:8px; border:1px solid var(--border2); background:rgba(255,255,255,.6); cursor:pointer; }
.icon-btn:hover{ background:var(--cream); }
.icon-btn.danger{ color:var(--red); }

.item-media{ width:100%; border-radius:11px; overflow:hidden; background:#000; margin-bottom:11px; }
.item-media img{ width:100%; display:block; max-height:342px; object-fit:cover; }
.item-media iframe{ width:100%; height:266px; border:none; display:block; }
.item-media .link-fallback{ display:block; padding:25px; text-align:center; color:#fff; background:linear-gradient(135deg, var(--plum), var(--gold)); text-decoration:none; font-size:13px; font-weight:600; }
.item-review{ font-size:13.5px; font-weight:500; line-height:1.75; color:var(--ink); background:rgba(255,255,255,.5); border-radius:10px; padding:11px 13px; margin-bottom:9px; }
.item-date{ font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:14px; }

.comments{ border-top:1px dashed var(--border2); padding-top:12px; }
.comment-row{ display:flex; gap:8px; align-items:flex-start; margin-bottom:9px; font-size:13.5px; }
.comment-icon{ font-size:17px; flex-shrink:0; }
.comment-text{ flex:1; line-height:1.6; font-weight:500; }
.comment-author{ font-weight:700; color:var(--plum); margin-right:4px; }
.comment-time{ font-size:10.5px; font-weight:600; color:var(--ink-soft); }
.comment-edit-icons{ display:flex; gap:4px; flex-shrink:0; }
.comment-edit-icons span{ font-size:11px; cursor:pointer; opacity:.5; }
.comment-edit-icons span:hover{ opacity:1; }

.comment-form{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center; }
.comment-form select{ font-size:12.5px; padding:7px 8px; border-radius:8px; border:1px solid var(--border2); background:#fff; flex-shrink:0; }
.comment-form input[type="text"]{ flex:1 1 100px; min-width:0; font-size:13.5px; padding:9px 12px; border-radius:999px; border:1px solid var(--border2); background:#fff; outline:none; }
.comment-form button{ font-size:12.5px; font-weight:700; padding:8px 15px; border-radius:999px; border:none; background:linear-gradient(135deg, var(--gold), #cf8c58); color:#fff8f0; cursor:pointer; flex-shrink:0; }
.comment-form button:disabled{ opacity:.6; cursor:not-allowed; }

.empty-note{ font-size:14px; font-weight:500; color:var(--ink-soft); text-align:center; padding:40px 20px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(47,28,43,.4); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal{ width:460px; max-width:100%; background:var(--cream); border-radius:20px; padding:26px; box-shadow:0 30px 60px -20px rgba(47,28,43,.5); max-height:88vh; overflow-y:auto; position:relative; }
.close-x{
  position:absolute; top:14px; right:14px; z-index:5;
  width:30px; height:30px; border-radius:50%; border:none;
  background:rgba(217,160,102,.15); color:var(--plum);
  font-size:14px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.close-x:hover{ background:rgba(217,160,102,.3); }
.modal-title{ font-family:var(--font-serif); font-size:18px; font-weight:700; color:var(--plum); margin-bottom:16px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
.field input[type="text"], .field textarea{
  width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border2);
  background:#fff; font-family:var(--font-body); font-size:14.5px; color:var(--ink); outline:none; resize:vertical;
}
.field textarea{ min-height:100px; line-height:1.6; }
.err-box{ font-size:12.5px; font-weight:600; color:var(--red); margin-bottom:10px; display:none; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
.mbtn{ font-family:var(--font-body); font-size:13.5px; font-weight:700; padding:10px 18px; border-radius:999px; border:1px solid var(--border2); background:rgba(255,255,255,.6); color:var(--plum); cursor:pointer; }
.mbtn.primary{ background:linear-gradient(135deg, var(--gold), #cf8c58); color:#fff8f0; border:none; }
.mbtn:disabled{ opacity:.6; cursor:not-allowed; }
</style>
</head>

<script>
  if (sessionStorage.getItem('shim627_unlocked') !== '1') {
    location.href = '../index.html';
  }

  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzILmO8_ZO025q6JuZ0ojZ_gF68Kz8bsM3aCCZk2EUQ3XN_sbQsbKvYlDeGMgjIYVRr2w/exec';

  // 응답이 너무 오래 걸리면(15초) 자동으로 실패 처리 - 버튼이 영원히 멈추는 것 방지
  function fetchWithTimeout(url, options, timeoutMs) {
    timeoutMs = timeoutMs || 15000;
    const controller = new AbortController();
    const timer = setTimeout(function(){ controller.abort(); }, timeoutMs);
    return fetch(url, Object.assign({}, options, { signal: controller.signal }))
      .then(function(res){ clearTimeout(timer); return res; })
      .catch(function(err){
        clearTimeout(timer);
        if (err.name === 'AbortError') throw new Error('응답이 너무 늦어요 (' + (timeoutMs/1000) + '초 초과). 네트워크 상태를 확인하고 다시 시도해주세요.');
        throw err;
      });
  }
  const AUTHORS = [
    { key:'우승', label:'우승 💙', icon:'💙' },
    { key:'성화', label:'성화 💗', icon:'💗' }
  ];

  let _items = [];
  let _comments = [];
  let _searchQuery = '';
  let _addSubmitting = false;
  let _editSubmitting = false;
  let _editingId = null;
  const _commentSubmitting = {}; // bucketId -> bool

  function detectMediaType(url) {
    if (!url) return 'none';
    if (/youtu\.?be/.test(url)) return 'youtube';
    if (/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(url)) return 'image';
    if (/\.(mp4|webm|mov)(\?.*)?$/i.test(url)) return 'video';
    return 'link';
  }
  function youtubeEmbed(url) {
    const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/);
    return 'https://www.youtube.com/embed/' + (m ? m[1] : '');
  }
  function renderMedia(url) {
    const type = detectMediaType(url);
    if (type === 'youtube') return '<iframe src="' + youtubeEmbed(url) + '" allowfullscreen></iframe>';
    if (type === 'image') return '<img src="' + url + '" alt="">';
    if (type === 'video') return '<video src="' + url + '" controls style="width:100%; max-height:360px;"></video>';
    if (type === 'link') return '<a class="link-fallback" href="' + url + '" target="_blank" rel="noopener">🔗 링크 열어보기</a>';
    return '';
  }

  let _addSelectedTags = [];
  let _editSelectedTags = [];

  function allKnownTags() {
    const preset = ['온라인', '오프라인'];
    const dyn = [];
    _items.forEach(function(it){
      tagsArray(it).forEach(function(t){ if (preset.indexOf(t) === -1 && dyn.indexOf(t) === -1) dyn.push(t); });
    });
    return preset.concat(dyn);
  }

  function renderTagPicker(containerId, selectedArr, toggleFnName) {
    const el = document.getElementById(containerId);
    const known = allKnownTags();
    const chips = known.map(function(t){
      const sel = selectedArr.indexOf(t) !== -1;
      return '<span class="tag-picker-chip' + (sel?' selected':'') + '" onclick="' + toggleFnName + '(\'' + t + '\')">' + t + '</span>';
    }).join('');
    el.innerHTML = chips + '<span class="tag-new-btn" onclick="showNewTagInput(\'' + containerId + '\')">＋ 신규</span>' +
      '<div class="tag-new-input-wrap" id="' + containerId + '_newWrap" style="display:none;">' +
        '<input type="text" id="' + containerId + '_newInput" placeholder="새 태그 이름">' +
        '<button onclick="confirmNewTag(\'' + containerId + '\')">추가</button>' +
      '</div>';
  }

  function toggleAddTag(tag) {
    const i = _addSelectedTags.indexOf(tag);
    if (i === -1) _addSelectedTags.push(tag); else _addSelectedTags.splice(i,1);
    renderTagPicker('addTagPicker', _addSelectedTags, 'toggleAddTag');
  }
  function toggleEditTag(tag) {
    const i = _editSelectedTags.indexOf(tag);
    if (i === -1) _editSelectedTags.push(tag); else _editSelectedTags.splice(i,1);
    renderTagPicker('editTagPicker', _editSelectedTags, 'toggleEditTag');
  }

  function showNewTagInput(containerId) {
    document.getElementById(containerId + '_newWrap').style.display = 'flex';
    document.getElementById(containerId + '_newInput').focus();
  }
  function confirmNewTag(containerId) {
    const input = document.getElementById(containerId + '_newInput');
    const val = input.value.trim();
    if (!val) return;
    const isAdd = containerId === 'addTagPicker';
    const arr = isAdd ? _addSelectedTags : _editSelectedTags;
    if (arr.indexOf(val) === -1) arr.push(val);
    if (isAdd) renderTagPicker('addTagPicker', _addSelectedTags, 'toggleAddTag');
    else renderTagPicker('editTagPicker', _editSelectedTags, 'toggleEditTag');
  }

  function openAddModal() {
    document.getElementById('itemTitle').value = '';
    document.getElementById('itemMediaUrl').value = '';
    document.getElementById('itemReview').value = '';
    _addSelectedTags = [];
    renderTagPicker('addTagPicker', _addSelectedTags, 'toggleAddTag');
    document.getElementById('addErr').style.display = 'none';
    document.getElementById('addModal').style.display = 'flex';
  }
  function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

  async function submitItem() {
    if (_addSubmitting) return;
    const title = document.getElementById('itemTitle').value.trim();
    const mediaUrl = document.getElementById('itemMediaUrl').value.trim();
    const review = document.getElementById('itemReview').value.trim();
    const tags = _addSelectedTags.join(', ');
    const errEl = document.getElementById('addErr');
    errEl.style.display = 'none';
    if (!title) { errEl.textContent = '제목을 입력해주세요.'; errEl.style.display = 'block'; return; }

    _addSubmitting = true;
    const btn = document.getElementById('addSubmitBtn');
    btn.disabled = true; btn.textContent = '게시 중입니다…';
    try {
      const res = await fetchWithTimeout(GAS_URL, {
        method:'POST',
        body: JSON.stringify({ action:'addBucket', item:{ title, mediaUrl, mediaType: detectMediaType(mediaUrl), review, tags } })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장 실패');
      _items.unshift(data.item);
      renderTagFilterBar();
      renderItems();
      renderStats();
      closeAddModal();
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      _addSubmitting = false;
      btn.disabled = false; btn.textContent = '추가';
    }
  }

  function openEditModal(id) {
    const it = _items.find(function(x){ return x.id === id; });
    if (!it) return;
    _editingId = id;
    document.getElementById('editTitle').value = it.title || '';
    document.getElementById('editMediaUrl').value = it.mediaUrl || '';
    document.getElementById('editReview').value = it.review || '';
    _editSelectedTags = tagsArray(it);
    renderTagPicker('editTagPicker', _editSelectedTags, 'toggleEditTag');
    document.getElementById('editErr').style.display = 'none';
    document.getElementById('editModal').style.display = 'flex';
  }
  function closeEditModal() { document.getElementById('editModal').style.display = 'none'; _editingId = null; }

  async function submitEdit() {
    if (_editSubmitting) return;
    const title = document.getElementById('editTitle').value.trim();
    const mediaUrl = document.getElementById('editMediaUrl').value.trim();
    const review = document.getElementById('editReview').value.trim();
    const tags = _editSelectedTags.join(', ');
    const errEl = document.getElementById('editErr');
    errEl.style.display = 'none';
    if (!title) { errEl.textContent = '제목을 입력해주세요.'; errEl.style.display = 'block'; return; }

    _editSubmitting = true;
    const btn = document.getElementById('editSubmitBtn');
    btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const patch = { title, mediaUrl, mediaType: detectMediaType(mediaUrl), review, tags };
      const res = await fetchWithTimeout(GAS_URL, { method:'POST', body: JSON.stringify({ action:'updateBucket', id:_editingId, patch }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '수정 실패');
      const it = _items.find(function(x){ return x.id === _editingId; });
      Object.assign(it, patch);
      renderTagFilterBar();
      renderItems();
      renderStats();
      closeEditModal();
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      _editSubmitting = false;
      btn.disabled = false; btn.textContent = '저장';
    }
  }

  async function deleteItem(id) {
    if (!confirm('이 항목을 삭제할까요? 댓글도 함께 삭제돼요.')) return;
    try {
      const res = await fetchWithTimeout(GAS_URL, { method:'POST', body: JSON.stringify({ action:'deleteBucket', id }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '삭제 실패');
      _items = _items.filter(function(x){ return x.id !== id; });
      _comments = _comments.filter(function(c){ return c.bucketId !== id; });
      renderItems();
      renderStats();
    } catch(e) {
      alert('삭제 실패: ' + e.message);
    }
  }

  async function toggleCompleted(id) {
    const it = _items.find(function(x){ return x.id === id; });
    if (!it) return;
    const next = it.completed === 'true' ? 'false' : 'true';
    it.completed = next; // 낙관적 갱신
    renderItems();
    renderStats();
    try {
      const res = await fetchWithTimeout(GAS_URL, { method:'POST', body: JSON.stringify({ action:'updateBucket', id, patch:{ completed: next } }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장 실패');
    } catch(e) {
      it.completed = next === 'true' ? 'false' : 'true'; // 실패 시 롤백
      renderItems();
      renderStats();
      alert('완료 상태 저장 실패: ' + e.message);
    }
  }

  function commentsFor(bucketId) {
    return _comments.filter(function(c){ return c.bucketId === bucketId; });
  }

  async function submitComment(bucketId) {
    if (_commentSubmitting[bucketId]) return; // 중복 제출 방지
    const authorSel = document.getElementById('cAuthor_' + bucketId);
    const textInput = document.getElementById('cText_' + bucketId);
    const btn = document.getElementById('cBtn_' + bucketId);
    const text = textInput.value.trim();
    if (!text) return;

    _commentSubmitting[bucketId] = true;
    textInput.disabled = true; btn.disabled = true; btn.textContent = '등록 중…';
    try {
      const res = await fetchWithTimeout(GAS_URL, {
        method:'POST',
        body: JSON.stringify({ action:'addBucketComment', comment:{ bucketId, author: authorSel.value, text } })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장 실패');
      _comments.push(data.comment);
      renderItems();
    } catch(e) {
      alert('댓글 저장 실패: ' + e.message);
    } finally {
      _commentSubmitting[bucketId] = false;
      // renderItems()가 새로 그리면서 입력창을 초기화하므로 별도 복구 불필요
    }
  }

  async function editComment(commentId, bucketId) {
    const c = _comments.find(function(x){ return x.id === commentId; });
    if (!c) return;
    const newText = prompt('댓글 수정', c.text);
    if (newText === null || !newText.trim()) return;
    try {
      const res = await fetchWithTimeout(GAS_URL, { method:'POST', body: JSON.stringify({ action:'updateBucketComment', id:commentId, patch:{ text:newText.trim() } }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '수정 실패');
      c.text = newText.trim();
      renderItems();
    } catch(e) {
      alert('수정 실패: ' + e.message);
    }
  }

  async function deleteComment(commentId) {
    if (!confirm('댓글을 삭제할까요?')) return;
    try {
      const res = await fetchWithTimeout(GAS_URL, { method:'POST', body: JSON.stringify({ action:'deleteBucketComment', id:commentId }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '삭제 실패');
      _comments = _comments.filter(function(c){ return c.id !== commentId; });
      renderItems();
    } catch(e) {
      alert('삭제 실패: ' + e.message);
    }
  }

  function authorIcon(name) {
    const a = AUTHORS.find(function(x){ return x.key === name; });
    return a ? a.icon : '💬';
  }

  let _activeTagFilter = '전체';

  function tagsArray(it) {
    return (it.tags || '').split(',').map(function(t){ return t.trim(); }).filter(Boolean);
  }

  function onSearch() {
    _searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    renderItems();
  }

  function matchesSearch(it) {
    if (!_searchQuery) return true;
    const q = _searchQuery;
    if ((it.title||'').toLowerCase().indexOf(q) !== -1) return true;
    if ((it.review||'').toLowerCase().indexOf(q) !== -1) return true;
    if (tagsArray(it).some(function(t){ return t.toLowerCase().indexOf(q) !== -1; })) return true;
    const cs = commentsFor(it.id);
    return cs.some(function(c){ return (c.text||'').toLowerCase().indexOf(q) !== -1; });
  }

  function matchesTagFilter(it) {
    if (_activeTagFilter === '전체') return true;
    return tagsArray(it).indexOf(_activeTagFilter) !== -1;
  }

  function selectTagFilter(tag) {
    _activeTagFilter = tag;
    renderTagFilterBar();
    renderItems();
  }

  function renderTagFilterBar() {
    const bar = document.getElementById('tagFilterBar');
    const preset = ['전체', '온라인', '오프라인'];
    const dynamicTags = [];
    _items.forEach(function(it){
      tagsArray(it).forEach(function(t){
        if (preset.indexOf(t) === -1 && dynamicTags.indexOf(t) === -1) dynamicTags.push(t);
      });
    });
    const allTags = preset.concat(dynamicTags);
    bar.innerHTML = allTags.map(function(t){
      return '<span class="tag-chip' + (t===_activeTagFilter?' active':'') + '" onclick="selectTagFilter(\'' + t + '\')">' + t + '</span>';
    }).join('');
  }

  async function quickAddTag(id) {
    const it = _items.find(function(x){ return x.id === id; });
    if (!it) return;
    const cur = tagsArray(it);
    const input = prompt('태그를 쉼표로 구분해서 입력해줘 (예: 온라인, 맛집)', cur.join(', '));
    if (input === null) return;
    const newTags = input.trim();
    try {
      const res = await fetchWithTimeout(GAS_URL, { method:'POST', body: JSON.stringify({ action:'updateBucket', id: id, patch:{ tags: newTags } }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '태그 저장 실패');
      it.tags = newTags;
      renderTagFilterBar();
      renderItems();
      renderStats();
    } catch(e) {
      alert('태그 저장 실패: ' + e.message);
    }
  }

  function renderItems() {
    const wrap = document.getElementById('itemsWrap');
    const filtered = _items.filter(matchesSearch).filter(matchesTagFilter);

    if (!filtered.length) {
      wrap.innerHTML = '<div class="empty-note" style="grid-column:1/-1;">' + (_searchQuery || _activeTagFilter !== '전체' ? '조건에 맞는 항목이 없어요.' : '아직 등록된 버킷리스트가 없어요. 첫 항목을 추가해보세요.') + '</div>';
      return;
    }

    wrap.innerHTML = filtered.map(function(it){
      const cs = commentsFor(it.id);
      const commentsHtml = cs.map(function(c){
        return '<div class="comment-row">' +
          '<span class="comment-icon">' + authorIcon(c.author) + '</span>' +
          '<span class="comment-text"><span class="comment-author">' + c.author + '</span>' + c.text + ' <span class="comment-time">' + (c.createdAt||'') + '</span></span>' +
          '<span class="comment-edit-icons">' +
            '<span title="수정" onclick="editComment(\'' + c.id + '\',\'' + it.id + '\')">✏️</span>' +
            '<span title="삭제" onclick="deleteComment(\'' + c.id + '\')">🗑</span>' +
          '</span>' +
        '</div>';
      }).join('');

      const authorOptions = AUTHORS.map(function(a){ return '<option value="'+a.key+'">'+a.label+'</option>'; }).join('');
      const tagPills = tagsArray(it).map(function(t){ return '<span class="tag-pill">' + t + '</span>'; }).join('');

      const isDone = it.completed === 'true';
      return '<div class="item-card' + (isDone?' completed':'') + '" id="item_' + it.id + '">' +
        '<div class="item-head">' +
          '<div class="item-title">' + it.title + '</div>' +
          '<div class="item-actions">' +
            '<button class="icon-btn done-btn' + (isDone?' active':'') + '" title="완료 처리" onclick="toggleCompleted(\'' + it.id + '\')">' + (isDone ? '✅' : '⬜') + '</button>' +
            '<button class="icon-btn" title="수정" onclick="openEditModal(\'' + it.id + '\')">✏️</button>' +
            '<button class="icon-btn danger" title="삭제" onclick="deleteItem(\'' + it.id + '\')">🗑</button>' +
          '</div>' +
        '</div>' +
        '<div class="item-tags">' + tagPills + '<span class="tag-add-btn" onclick="quickAddTag(\'' + it.id + '\')">🏷️+</span></div>' +
        (it.mediaUrl ? '<div class="item-media">' + renderMedia(it.mediaUrl) + '</div>' : '') +
        (it.review ? '<div class="item-review">' + it.review + '</div>' : '') +
        '<div class="item-date">' + (it.createdAt||'') + '</div>' +
        '<div class="comments">' +
          commentsHtml +
          '<div class="comment-form">' +
            '<select id="cAuthor_' + it.id + '">' + authorOptions + '</select>' +
            '<input type="text" id="cText_' + it.id + '" placeholder="댓글 남기기" onkeydown="if(event.key===\'Enter\'){ event.preventDefault(); submitComment(\'' + it.id + '\'); }">' +
            '<button id="cBtn_' + it.id + '" onclick="submitComment(\'' + it.id + '\')">등록</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function donutSVG(pct, color) {
    const r = 30, c = 2 * Math.PI * r;
    const offset = c * (1 - pct / 100);
    return '<svg width="76" height="76" viewBox="0 0 76 76">' +
      '<circle cx="38" cy="38" r="' + r + '" fill="none" stroke="rgba(217,160,102,.15)" stroke-width="9"/>' +
      '<circle cx="38" cy="38" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="9" ' +
        'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '" ' +
        'stroke-linecap="round" transform="rotate(-90 38 38)"/>' +
    '</svg>';
  }

  function renderStats() {
    // ── 온라인/오프라인 달성률 도넛 ──
    const onlineItems = _items.filter(function(it){ return tagsArray(it).indexOf('온라인') !== -1; });
    const offlineItems = _items.filter(function(it){ return tagsArray(it).indexOf('오프라인') !== -1; });
    const onlineDone = onlineItems.filter(function(it){ return it.completed === 'true'; }).length;
    const offlineDone = offlineItems.filter(function(it){ return it.completed === 'true'; }).length;
    const onlinePct = onlineItems.length ? Math.round(onlineDone / onlineItems.length * 100) : 0;
    const offlinePct = offlineItems.length ? Math.round(offlineDone / offlineItems.length * 100) : 0;

    document.getElementById('onlineDonut').innerHTML =
      donutSVG(onlinePct, 'var(--blue)') +
      '<div><div class="donut-pct">' + onlinePct + '%</div><div class="donut-label">' + onlineDone + ' / ' + onlineItems.length + ' 완료</div></div>';

    document.getElementById('offlineDonut').innerHTML =
      donutSVG(offlinePct, 'var(--gold)') +
      '<div><div class="donut-pct">' + offlinePct + '%</div><div class="donut-label">' + offlineDone + ' / ' + offlineItems.length + ' 완료</div></div>';

    // ── 월별 등록 현황 (온라인/오프라인 분리 스택 막대) ──
    const monthMap = {}; // 'YYYY-MM' -> {online, offline}
    _items.forEach(function(it){
      const dateStr = it.createdAt || '';
      const m = dateStr.match(/^(\d{4})-(\d{2})/);
      if (!m) return;
      const key = m[1] + '-' + m[2];
      if (!monthMap[key]) monthMap[key] = { online:0, offline:0 };
      const tags = tagsArray(it);
      if (tags.indexOf('온라인') !== -1) monthMap[key].online++;
      if (tags.indexOf('오프라인') !== -1) monthMap[key].offline++;
    });
    const months = Object.keys(monthMap).sort().slice(-6); // 최근 6개월
    const maxVal = months.reduce(function(mx, k){ return Math.max(mx, monthMap[k].online + monthMap[k].offline); }, 1);

    const chartEl = document.getElementById('monthlyBarChart');
    if (!months.length) {
      chartEl.innerHTML = '<div class="empty-note" style="padding:10px;">아직 데이터가 없어요.</div>';
    } else {
      chartEl.innerHTML = months.map(function(key){
        const v = monthMap[key];
        const total = v.online + v.offline;
        const onlineH = total ? (v.online / maxVal * 110) : 0;
        const offlineH = total ? (v.offline / maxVal * 110) : 0;
        const label = key.slice(2).replace('-', '.');
        return '<div class="bar-col">' +
          '<div class="bar-stack" style="height:' + Math.max(onlineH+offlineH, 2) + 'px;">' +
            '<div class="bar-seg-offline" style="height:' + offlineH + 'px;"></div>' +
            '<div class="bar-seg-online" style="height:' + onlineH + 'px;"></div>' +
          '</div>' +
          '<div class="bar-month-label">' + label + '</div>' +
        '</div>';
      }).join('');
    }
  }

  async function init() {
    document.getElementById('gasBadge').textContent = '불러오는 중…';
    try {
      const res = await fetch('data/bucket.json?t=' + Date.now());
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'GAS 응답 오류');
      _items = (data.items || []).reverse();
      _comments = data.comments || [];
      document.getElementById('gasBadge').textContent = '✅ GAS 연동됨';
    } catch(e) {
      document.getElementById('gasBadge').textContent = '⚠️ GAS 응답 실패';
      console.warn('[버킷리스트] 로드 실패:', e.message);
    }
    renderTagFilterBar();
    renderItems();
    renderStats();

    const openId = new URLSearchParams(location.search).get('open');
    if (openId) {
      setTimeout(function(){
        const el = document.getElementById('item_' + openId);
        if (el) { el.scrollIntoView({ behavior:'smooth', block:'center' }); el.style.boxShadow = '0 0 0 3px var(--gold)'; }
      }, 100);
    }
  }

  const today = new Date();
  document.getElementById('todayLine').textContent =
    today.getFullYear() + '. ' + String(today.getMonth()+1).padStart(2,'0') + '. ' + String(today.getDate()).padStart(2,'0');

  init();
</script>
