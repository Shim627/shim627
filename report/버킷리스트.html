<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>버킷리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --plum:#3d2a37; --blush:#f7d9de; --blush-soft:#fbe9ec;
  --gold:#d9a066; --gold-dim:rgba(217,160,102,.14);
  --lavender:#d9c9e8; --cream:#fff8f3;
  --ink:#3d2a37; --ink-soft:#6b5568;
  --border:rgba(217,160,102,.22); --border2:rgba(217,160,102,.4);
  --red:#c76b7a; --green:#7a8f5e;
  --font-serif:'Gowun Batang', serif;
  --font-body:'Gowun Dodum', sans-serif;
}
html,body{
  margin:0; padding:0; min-height:100vh;
  font-family:var(--font-body); color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%, #f9e3e6 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, #e6d6ef 0%, transparent 50%),
    linear-gradient(160deg, #fdf3f0 0%, #f6e6ee 55%, #ece0f2 100%);
}
::-webkit-scrollbar{ width:6px; }
::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:3px; }

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px; background:rgba(255,255,255,.5); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20; backdrop-filter:blur(6px);
}
.topbar a{ font-family:var(--font-serif); font-size:14px; font-weight:700; color:var(--plum); text-decoration:none; }
.gas-badge{ font-size:11.5px; font-weight:700; background:var(--gold-dim); color:var(--plum); padding:4px 10px; border-radius:999px; border:1px solid var(--border2); }

.wrap{ max-width:820px; margin:0 auto; padding:32px 22px 80px; }

.hero{ text-align:center; margin-bottom:24px; }
.hero .eyebrow{ font-family:var(--font-serif); font-size:13px; font-weight:700; color:var(--gold); letter-spacing:.3em; margin-bottom:8px; }
.hero h1{ font-family:var(--font-serif); font-size:24px; font-weight:700; color:var(--plum); margin-bottom:8px; }
.hero .desc{ font-size:14px; font-weight:500; color:var(--ink-soft); line-height:1.7; }

.add-btn-wrap{ text-align:center; margin-bottom:28px; }
.add-btn{
  font-family:var(--font-serif); font-size:15px; font-weight:700; color:#fff8f0;
  background:linear-gradient(135deg, var(--gold), #cf8c58);
  padding:12px 30px; border-radius:999px; border:none; cursor:pointer;
  box-shadow:0 10px 22px -8px rgba(185,113,58,.55);
}

.items{ display:flex; flex-direction:column; gap:22px; }
.item-card{
  background:rgba(255,255,255,.55); border:1px solid var(--border); border-radius:18px;
  padding:18px; box-shadow:0 12px 26px -16px rgba(74,46,68,.3);
}
.item-title{ font-family:var(--font-serif); font-size:16px; font-weight:700; color:var(--plum); margin-bottom:10px; }
.item-media{ width:100%; border-radius:12px; overflow:hidden; background:#000; margin-bottom:12px; }
.item-media img{ width:100%; display:block; max-height:420px; object-fit:cover; }
.item-media iframe{ width:100%; height:320px; border:none; display:block; }
.item-media .link-fallback{ display:block; padding:26px; text-align:center; color:#fff; background:linear-gradient(135deg, var(--plum), var(--gold)); text-decoration:none; font-size:13px; }
.item-review{ font-size:13.5px; line-height:1.7; color:var(--ink); background:rgba(255,255,255,.5); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
.item-date{ font-size:11px; color:var(--ink-soft); margin-bottom:14px; }

.comments{ border-top:1px dashed var(--border2); padding-top:12px; }
.comment-row{ display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; font-size:12.5px; }
.comment-icon{ font-size:16px; flex-shrink:0; }
.comment-text{ flex:1; line-height:1.5; }
.comment-author{ font-weight:700; color:var(--plum); margin-right:4px; }
.comment-time{ font-size:10px; color:var(--ink-soft); }

.comment-form{ display:flex; gap:6px; margin-top:10px; align-items:center; }
.comment-form select{ font-size:12px; padding:6px 8px; border-radius:8px; border:1px solid var(--border2); background:#fff; }
.comment-form input[type="text"]{ flex:1; font-size:12.5px; padding:8px 10px; border-radius:999px; border:1px solid var(--border2); background:#fff; outline:none; }
.comment-form button{ font-size:12px; font-weight:700; padding:7px 14px; border-radius:999px; border:none; background:linear-gradient(135deg, var(--gold), #cf8c58); color:#fff8f0; cursor:pointer; }

.empty-note{ font-size:13.5px; color:var(--ink-soft); text-align:center; padding:40px 20px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(47,28,43,.4); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal{ width:460px; max-width:100%; background:var(--cream); border-radius:20px; padding:26px; box-shadow:0 30px 60px -20px rgba(47,28,43,.5); max-height:88vh; overflow-y:auto; }
.modal-title{ font-family:var(--font-serif); font-size:17px; font-weight:700; color:var(--plum); margin-bottom:16px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
.field input[type="text"], .field textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border2);
  background:#fff; font-family:var(--font-body); font-size:14px; color:var(--ink); outline:none; resize:vertical;
}
.field textarea{ min-height:100px; line-height:1.6; }
.err-box{ font-size:12px; color:var(--red); margin-bottom:10px; display:none; }
.modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
.mbtn{ font-family:var(--font-body); font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px; border:1px solid var(--border2); background:rgba(255,255,255,.6); color:var(--plum); cursor:pointer; }
.mbtn.primary{ background:linear-gradient(135deg, var(--gold), #cf8c58); color:#fff8f0; border:none; }
</style>
</head>
<body>

<div class="topbar">
  <a href="../main/home.html">🏠 우리 홈으로</a>
  <span class="gas-badge" id="gasBadge">GAS 연동 확인 중…</span>
</div>

<div class="wrap">
  <div class="hero">
    <p class="eyebrow">WS &amp; SH</p>
    <h1>버킷리스트</h1>
    <p class="desc">같이 하고 싶은 것들을 사진이나 영상으로 남겨두는 곳이에요.</p>
  </div>

  <div class="add-btn-wrap">
    <button class="add-btn" onclick="openAddModal()">➕ 항목 추가</button>
  </div>

  <div class="items" id="itemsWrap"></div>
</div>

<!-- 추가 모달 -->
<div class="modal-overlay" id="addModal" onclick="if(event.target===this) closeAddModal()">
  <div class="modal">
    <p class="modal-title">버킷리스트 추가</p>
    <div class="field">
      <label>제목</label>
      <input type="text" id="itemTitle" placeholder="예: 발리 여행 가기">
    </div>
    <div class="field">
      <label>사진 또는 영상 링크</label>
      <input type="text" id="itemMediaUrl" placeholder="이미지 URL 또는 유튜브 링크">
    </div>
    <div class="field">
      <label>느낌 / 의견</label>
      <textarea id="itemReview" placeholder="왜 하고 싶은지, 어떤 느낌인지 적어봐"></textarea>
    </div>
    <div class="err-box" id="addErr"></div>
    <div class="modal-actions">
      <button class="mbtn" onclick="closeAddModal()">취소</button>
      <button class="mbtn primary" onclick="submitItem()">추가</button>
    </div>
  </div>
</div>

<script>
  if (sessionStorage.getItem('shim627_unlocked') !== '1') {
    location.href = '../index.html';
  }

  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzILmO8_ZO025q6JuZ0ojZ_gF68Kz8bsM3aCCZk2EUQ3XN_sbQsbKvYlDeGMgjIYVRr2w/exec';

  const AUTHORS = [
    { key:'우승', label:'우승 💙', icon:'💙' },
    { key:'성화', label:'성화 💗', icon:'💗' }
  ];

  let _items = [];
  let _comments = [];

  function detectMediaType(url) {
    if (!url) return 'none';
    if (/youtu\.?be/.test(url)) return 'youtube';
    if (/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/i.test(url)) return 'image';
    if (/\.(mp4|webm|mov)(\?.*)?$/i.test(url)) return 'video';
    return 'link';
  }

  function youtubeEmbed(url) {
    const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{6,})/);
    const id = m ? m[1] : '';
    return 'https://www.youtube.com/embed/' + id;
  }

  function renderMedia(url) {
    const type = detectMediaType(url);
    if (type === 'youtube') return '<iframe src="' + youtubeEmbed(url) + '" allowfullscreen></iframe>';
    if (type === 'image') return '<img src="' + url + '" alt="">';
    if (type === 'video') return '<video src="' + url + '" controls style="width:100%; max-height:420px;"></video>';
    if (type === 'link') return '<a class="link-fallback" href="' + url + '" target="_blank" rel="noopener">🔗 링크 열어보기</a>';
    return '';
  }

  function openAddModal() {
    document.getElementById('itemTitle').value = '';
    document.getElementById('itemMediaUrl').value = '';
    document.getElementById('itemReview').value = '';
    document.getElementById('addErr').style.display = 'none';
    document.getElementById('addModal').style.display = 'flex';
  }
  function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

  async function submitItem() {
    const title = document.getElementById('itemTitle').value.trim();
    const mediaUrl = document.getElementById('itemMediaUrl').value.trim();
    const review = document.getElementById('itemReview').value.trim();
    const errEl = document.getElementById('addErr');
    errEl.style.display = 'none';
    if (!title) { errEl.textContent = '제목을 입력해주세요.'; errEl.style.display = 'block'; return; }

    try {
      const res = await fetch(GAS_URL, {
        method:'POST',
        body: JSON.stringify({ action:'addBucket', item:{ title, mediaUrl, mediaType: detectMediaType(mediaUrl), review } })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장 실패');
      _items.unshift(data.item);
      renderItems();
      closeAddModal();
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  }

  function commentsFor(bucketId) {
    return _comments.filter(function(c){ return c.bucketId === bucketId; });
  }

  async function submitComment(bucketId, idx) {
    const authorSel = document.getElementById('cAuthor_' + idx);
    const textInput = document.getElementById('cText_' + idx);
    const text = textInput.value.trim();
    if (!text) return;
    try {
      const res = await fetch(GAS_URL, {
        method:'POST',
        body: JSON.stringify({ action:'addBucketComment', comment:{ bucketId, author: authorSel.value, text } })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장 실패');
      _comments.push(data.comment);
      textInput.value = '';
      renderItems();
    } catch(e) {
      alert('댓글 저장 실패: ' + e.message);
    }
  }

  function authorIcon(name) {
    const a = AUTHORS.find(function(x){ return x.key === name; });
    return a ? a.icon : '💬';
  }

  function renderItems() {
    const wrap = document.getElementById('itemsWrap');
    if (!_items.length) {
      wrap.innerHTML = '<div class="empty-note">아직 등록된 버킷리스트가 없어요. 첫 항목을 추가해보세요.</div>';
      return;
    }

    wrap.innerHTML = _items.map(function(it, idx){
      const cs = commentsFor(it.id);
      const commentsHtml = cs.map(function(c){
        return '<div class="comment-row">' +
          '<span class="comment-icon">' + authorIcon(c.author) + '</span>' +
          '<span class="comment-text"><span class="comment-author">' + c.author + '</span>' + c.text + ' <span class="comment-time">' + (c.createdAt||'') + '</span></span>' +
        '</div>';
      }).join('');

      const authorOptions = AUTHORS.map(function(a){ return '<option value="'+a.key+'">'+a.label+'</option>'; }).join('');

      return '<div class="item-card">' +
        '<div class="item-title">' + it.title + '</div>' +
        (it.mediaUrl ? '<div class="item-media">' + renderMedia(it.mediaUrl) + '</div>' : '') +
        (it.review ? '<div class="item-review">' + it.review + '</div>' : '') +
        '<div class="item-date">' + (it.createdAt||'') + '</div>' +
        '<div class="comments">' +
          commentsHtml +
          '<div class="comment-form">' +
            '<select id="cAuthor_' + idx + '">' + authorOptions + '</select>' +
            '<input type="text" id="cText_' + idx + '" placeholder="댓글 남기기" onkeydown="if(event.key===\'Enter\') submitComment(\'' + it.id + '\',' + idx + ')">' +
            '<button onclick="submitComment(\'' + it.id + '\',' + idx + ')">등록</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  async function init() {
    document.getElementById('gasBadge').textContent = '불러오는 중…';
    try {
      const res = await fetch(GAS_URL + '?action=listBucket');
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'GAS 응답 오류');
      _items = (data.items || []).reverse();
      _comments = data.comments || [];
      document.getElementById('gasBadge').textContent = '✅ GAS 연동됨';
    } catch(e) {
      document.getElementById('gasBadge').textContent = '⚠️ GAS 응답 실패';
      console.warn('[버킷리스트] 로드 실패:', e.message);
    }
    renderItems();
  }
  init();
</script>

</body>
</html>
