<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>편지함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --plum:#3d2a37; --plum-deep:#2f1c2b;
  --blush:#f7d9de; --blush-soft:#fbe9ec;
  --gold:#d9a066; --gold-dim:rgba(217,160,102,.14);
  --lavender:#d9c9e8; --cream:#fff8f3;
  --ink:#3d2a37; --ink-soft:#6b5568;
  --border:rgba(217,160,102,.22); --border2:rgba(217,160,102,.4);
  --red:#c76b7a; --green:#7a8f5e;
  --sidebar-w:230px;
  --font-serif:'Gowun Batang', serif;
  --font-body:'Gowun Dodum', sans-serif;
}
html,body{
  width:100%; height:100vh; overflow:hidden;
  font-family:var(--font-body); color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%, #f9e3e6 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, #e6d6ef 0%, transparent 50%),
    linear-gradient(160deg, #fdf3f0 0%, #f6e6ee 55%, #ece0f2 100%);
}
::-webkit-scrollbar{ width:6px; }
::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:3px; }

#rpWrap{ display:flex; height:100vh; overflow:hidden; }

/* ---------- 사이드바 (report_main과 동일 컨셉) ---------- */
#rpSidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:rgba(255,255,255,.55); backdrop-filter:blur(6px);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100vh; overflow-y:auto;
}
.rps-brand{ display:flex; align-items:center; gap:10px; padding:22px 18px 18px; border-bottom:1px solid var(--border); }
.rps-brand-icon{ font-size:24px; }
.rps-brand-name{ font-family:var(--font-serif); font-size:15.5px; font-weight:700; color:var(--plum); }
.rps-brand-sub{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-top:2px; }

.rps-nav{ padding:14px 0 20px; flex:1; }
.nav-home-item{ display:flex; align-items:center; gap:10px; padding:11px 16px; margin:0 10px 10px; border-radius:12px; cursor:pointer; transition:all .15s; font-size:14.5px; font-weight:600; color:var(--ink); text-decoration:none; }
.nav-home-item:hover{ background:rgba(255,255,255,.6); }
.nav-home-item.active{ background:var(--gold-dim); color:var(--plum); border:1px solid var(--border2); }
.nav-home-item.home-link{ background:var(--blush-soft); border:1px solid var(--border2); }
.nav-home-item.home-link:hover{ background:var(--blush); }

.rps-footer{ padding:14px 18px; border-top:1px solid var(--border); font-size:12px; font-weight:600; color:var(--ink-soft); }

/* ---------- 메인 영역 ---------- */
#rpMain{ flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden; min-width:0; }
#statusBar{ flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:0 26px; height:44px; background:rgba(255,255,255,.5); border-bottom:1px solid var(--border); }
.sb-left{ display:flex; align-items:center; gap:10px; }
.sb-brand{ font-family:var(--font-serif); font-size:14.5px; font-weight:700; color:var(--plum); }
.sb-dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); animation:pulse-dot 2s infinite; }
@keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
.sb-crumb{ font-size:13px; font-weight:600; color:var(--ink-soft); }
.sb-right{ font-size:13px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:14px; }
.sb-badge{ font-size:11.5px; font-weight:700; background:var(--gold-dim); color:var(--plum); padding:4px 10px; border-radius:999px; border:1px solid var(--border2); }

#contentWrap{ flex:1; overflow-y:auto; }
#mainWrap{ padding:34px 48px 60px; max-width:1500px; margin:0 auto; }

.hero{ text-align:center; margin-bottom:24px; }
.hero .eyebrow{ font-family:var(--font-serif); font-size:14px; font-weight:700; color:var(--gold); letter-spacing:.3em; margin-bottom:8px; }
.hero h1{ font-family:var(--font-serif); font-size:26px; font-weight:700; color:var(--plum); margin-bottom:10px; }
.hero .desc{ font-size:15px; font-weight:600; color:var(--ink-soft); line-height:1.8; }

.write-btn-wrap{ text-align:center; margin-bottom:22px; }

.mail-filter-bar{ display:flex; gap:8px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.mail-filter-chip{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px;
  border:1px solid var(--border2); background:rgba(255,255,255,.5); color:var(--ink-soft); cursor:pointer;
  transition:all .15s;
}
.mail-filter-chip svg{ width:14px; height:14px; }
.mail-filter-chip.active{ background:var(--gold-dim); color:var(--plum); border-color:var(--gold); }

.stamp-picker{ display:flex; gap:12px; }
.stamp-choice{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:14px 10px; border-radius:14px; border:2px solid var(--border2);
  background:rgba(255,255,255,.5); cursor:pointer; transition:all .15s;
}
.stamp-choice svg{ width:38px; height:38px; }
.stamp-choice span{ font-size:12px; font-weight:700; color:var(--ink); }
.stamp-choice.selected{ border-color:var(--gold); background:var(--gold-dim); }

.deliver-field{ margin-top:12px; }
.deliver-field input[type="datetime-local"]{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border2);
  background:#fff; font-family:var(--font-body); font-size:13.5px; color:var(--ink); outline:none;
}

.stamp-badge-corner{ position:absolute; top:14px; right:14px; width:26px; height:26px; opacity:.9; }
.stamp-badge-corner svg{ width:100%; height:100%; }

.letter-card.locked{ opacity:.9; }
.letter-preview.mosaic{ filter:blur(5px); user-select:none; opacity:.75; }
.letter-title.mosaic, .letter-date.mosaic{ filter:blur(4px); user-select:none; opacity:.7; }
.guest-mode .write-btn{ display:none !important; }
.guest-mode .write-btn-wrap::after{ content:"👀 게스트는 편지 내용을 볼 수 없어요"; display:block; margin-top:10px; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
.locked-note{ font-size:12px; font-weight:600; color:var(--ink-soft); background:rgba(255,255,255,.4); border-radius:10px; padding:10px 12px; margin-top:6px; line-height:1.7; }

.read-stamp-badge{ position:absolute; top:18px; right:52px; width:34px; height:34px; }
.read-stamp-badge svg{ width:100%; height:100%; }
.read-time-block{ font-size:12px; font-weight:600; color:var(--ink-soft); line-height:1.9; text-align:right; margin-top:6px; }
.write-btn{
  font-family:var(--font-serif); font-size:16px; font-weight:700; color:#fff8f0;
  background:linear-gradient(135deg, var(--gold), #cf8c58);
  padding:13px 32px; border-radius:999px; border:none; cursor:pointer;
  box-shadow:0 10px 22px -8px rgba(185,113,58,.55);
}
.write-btn:hover{ transform:translateY(-2px); }

.letters-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(460px, 1fr)); gap:20px; }

.letter-card{
  border-radius:18px; padding:28px 26px 22px; cursor:pointer;
  box-shadow:0 12px 26px -14px rgba(74,46,68,.3);
  transition:transform .2s ease, box-shadow .2s ease;
  position:relative; overflow:hidden; min-height:240px;
  display:flex; flex-direction:column;
}
.letter-card:hover{ transform:translateY(-3px); box-shadow:0 16px 30px -14px rgba(74,46,68,.4); }
.letter-title{ font-family:var(--font-serif); font-size:19px; font-weight:700; margin-bottom:12px; line-height:1.4; }
.letter-preview{ font-size:15px; font-weight:500; line-height:1.8; flex:1; overflow:hidden; opacity:.9; white-space:pre-wrap; }
.letter-date{ font-size:11.5px; font-weight:600; margin-top:12px; opacity:.65; line-height:1.6; }

.theme-cream{ background:linear-gradient(160deg, #fffaf6, #fbeee6); color:#4a3830; }
.theme-blush{ background:linear-gradient(160deg, #fdeef1, #f7d9de); color:#5c2e39; }
.theme-lavender{ background:linear-gradient(160deg, #f3ecfa, #d9c9e8); color:#3a2d49; }
.theme-gold{ background:linear-gradient(160deg, #fdf3e2, #f0d9ae); color:#563a10; }
.theme-mint{ background:linear-gradient(160deg, #eef8f2, #cfe9d8); color:#204a32; }

.empty-note{ font-size:14px; font-weight:500; color:var(--ink-soft); text-align:center; padding:40px 20px; }

.modal-overlay{ position:fixed; inset:0; background:rgba(47,28,43,.4); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal{ width:460px; max-width:100%; background:var(--cream); border-radius:20px; padding:26px; box-shadow:0 30px 60px -20px rgba(47,28,43,.5); max-height:88vh; overflow-y:auto; }
.modal-title{ font-family:var(--font-serif); font-size:18px; font-weight:700; color:var(--plum); margin-bottom:16px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
.field input[type="text"], .field textarea{
  width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border2);
  background:#fff; font-family:var(--font-body); font-size:14.5px; color:var(--ink); outline:none; resize:vertical;
}
.field textarea{ min-height:140px; line-height:1.8; }
.theme-picker{ display:flex; gap:9px; flex-wrap:wrap; }
.theme-dot{ width:36px; height:36px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:all .15s; }
.theme-dot.selected{ border-color:var(--plum); transform:scale(1.12); }
.err-box{ font-size:12.5px; font-weight:600; color:var(--red); margin-bottom:10px; display:none; }
.modal-actions{ display:flex; justify-content:space-between; gap:8px; }
.modal-actions .left{ display:flex; gap:8px; }
.mbtn{ font-family:var(--font-body); font-size:13.5px; font-weight:700; padding:10px 18px; border-radius:999px; border:1px solid var(--border2); background:rgba(255,255,255,.6); color:var(--plum); cursor:pointer; }
.mbtn.primary{ background:linear-gradient(135deg, var(--gold), #cf8c58); color:#fff8f0; border:none; }
.mbtn.danger{ background:transparent; color:var(--red); border:1px solid rgba(199,107,122,.4); }
.mbtn:disabled{ opacity:.6; cursor:not-allowed; }

.read-modal .modal{ width:500px; }
.close-x{
  position:absolute; top:14px; right:14px; z-index:5;
  width:30px; height:30px; border-radius:50%; border:none;
  background:rgba(217,160,102,.15); color:var(--plum);
  font-size:14px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s ease;
}
.close-x:hover{ background:rgba(217,160,102,.3); }
.read-content{ font-family:var(--font-serif); font-size:16px; font-weight:500; line-height:2.1; white-space:pre-wrap; padding:22px; border-radius:14px; margin-bottom:14px; }
.read-date{ font-size:12.5px; font-weight:600; color:var(--ink-soft); text-align:right; }
.read-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }

/* ── 접이식 사이드바 (좁은 화면: 폴드 673px / 모바일 390px) ──
   기본은 아이콘만 보이는 좁은 레일 상태. 토글 버튼을 누르면
   오버레이로 펼쳐져서 본문 레이아웃을 밀어내지 않고 그 위에 뜬다. */
.sidebar-toggle-btn{ display:none; }
.sidebar-backdrop{ display:none; }

@media (max-width: 900px){
  #rpSidebar{
    width:64px;
    transition:width .2s ease;
    overflow:visible;
  }
  #rpSidebar .rps-brand{ flex-direction:column; gap:6px; padding:16px 4px; }
  #rpSidebar .rps-brand-name,
  #rpSidebar .rps-brand-sub{ display:none; }
  #rpSidebar .nav-home-item{
    justify-content:center;
    padding:11px 0;
    margin:0 8px 8px;
  }
  #rpSidebar .nav-home-item span:nth-child(2){ display:none; }
  #rpSidebar .rps-footer{ display:none; }

  .sidebar-toggle-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; margin:0 auto;
    border-radius:9px; border:1px solid var(--border2);
    background:rgba(255,255,255,.7); cursor:pointer; font-size:15px;
  }

  #rpSidebar.expanded{
    position:fixed; top:0; left:0; height:100vh;
    width:236px; z-index:200;
    box-shadow:16px 0 36px -12px rgba(0,0,0,.4);
  }
  #rpSidebar.expanded .rps-brand{ flex-direction:row; padding:22px 18px 18px; }
  #rpSidebar.expanded .rps-brand-name,
  #rpSidebar.expanded .rps-brand-sub{ display:block; }
  #rpSidebar.expanded .nav-home-item{ justify-content:flex-start; padding:11px 16px; margin:0 10px 10px; }
  #rpSidebar.expanded .nav-home-item span:nth-child(2){ display:inline; }
  #rpSidebar.expanded .rps-footer{ display:block; }

  .sidebar-backdrop.show{
    display:block;
    position:fixed; inset:0; background:rgba(20,10,20,.4);
    z-index:150;
  }
}
</style>
</head>

<script>
  if (sessionStorage.getItem('shim627_unlocked') !== '1') {
    location.href = '../index.html';
  }
  const IS_GUEST = sessionStorage.getItem('shim627_role') === 'guest';
  if (IS_GUEST) document.body.classList.add('guest-mode');

  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzILmO8_ZO025q6JuZ0ojZ_gF68Kz8bsM3aCCZk2EUQ3XN_sbQsbKvYlDeGMgjIYVRr2w/exec';

  // 응답이 너무 오래 걸리면 자동 실패 처리 (버튼이 영원히 멈추는 것 방지)
  function fetchWithTimeout(url, options, timeoutMs) {
    timeoutMs = timeoutMs || 15000;
    const controller = new AbortController();
    const timer = setTimeout(function(){ controller.abort(); }, timeoutMs);
    return fetch(url, Object.assign({}, options, { signal: controller.signal, cache: 'no-store' }))
      .then(function(res){ clearTimeout(timer); return res; })
      .catch(function(err){
        clearTimeout(timer);
        if (err.name === 'AbortError') throw new Error('응답이 너무 늦어요. 네트워크 상태를 확인하고 다시 시도해주세요.');
        throw err;
      });
  }
  // GET 요청 전용: 캐시버스팅 + 1회 자동 재시도 (콜드스타트 대비)
  function gasGet(action, tries) {
    tries = tries || 2;
    const url = GAS_URL + '?action=' + action + '&_=' + Date.now();
    function attempt(n, timeoutMs) {
      return fetchWithTimeout(url, {}, timeoutMs)
        .then(function(res){ return res.json(); })
        .catch(function(err){ if (n > 1) return attempt(n - 1, 15000); throw err; });
    }
    return attempt(tries, 7000);
  }
  // 로컬 캐시 (stale-while-revalidate)
  const LS_KEY = 'shim627_cache_letters';
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch(e) { return null; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ letters:_letters, savedAt: Date.now() })); } catch(e) {} }

  const THEMES = [
    { key:'cream',    label:'크림',   dot:'#f3e3d3' },
    { key:'blush',    label:'블러쉬', dot:'#f2c7cf' },
    { key:'lavender', label:'라벤더', dot:'#d3c2e8' },
    { key:'gold',     label:'골드',   dot:'#e8c583' },
    { key:'mint',     label:'민트',   dot:'#b8e0c6' }
  ];

  // 배경 없는 아이콘만 (우표 컨셉 재사용)
  const STAMP_ICONS = {
    express: '<svg viewBox="0 0 100 100"><path d="M55 8 L18 58 L44 58 L34 92 L82 40 L54 40 Z" fill="#c76b7a"/></svg>',
    slow: '<svg viewBox="0 0 100 100"><path d="M25 10 L75 10 L58 50 L75 90 L25 90 L42 50 Z" fill="none" stroke="#8f6fae" stroke-width="7" stroke-linejoin="round"/><path d="M31 16 L69 16 L52 50 L48 50 Z" fill="#b07fc9" opacity="0.55"/><path d="M40 84 L60 84 L52 54 L48 54 Z" fill="#8f6fae" opacity="0.55"/></svg>'
  };
  const STAMP_LABELS = { express:'특급우편', slow:'느린우편' };

  let _selectedTheme = 'cream';
  let _editTheme = 'cream';
  let _selectedStamp = 'express';
  let _editStamp = 'express';
  let _letters = [];
  let _activeIdx = null;
  let _isSubmitting = false;
  let _mailFilter = 'all'; // all | express | slow

  function renderThemePicker(containerId, current, onClick) {
    document.getElementById(containerId).innerHTML = THEMES.map(function(t){
      return '<div class="theme-dot' + (t.key===current?' selected':'') + '" style="background:' + t.dot + ';" title="' + t.label + '" onclick="' + onClick + '(\'' + t.key + '\')"></div>';
    }).join('');
  }
  function selectTheme(key) { _selectedTheme = key; renderThemePicker('themePicker', _selectedTheme, 'selectTheme'); }
  function selectEditTheme(key) { _editTheme = key; renderThemePicker('editThemePicker', _editTheme, 'selectEditTheme'); }

  function renderStampPicker(containerId, current, onClick) {
    document.getElementById(containerId).innerHTML = ['express','slow'].map(function(key){
      return '<div class="stamp-choice' + (key===current?' selected':'') + '" onclick="' + onClick + '(\'' + key + '\')">' + STAMP_ICONS[key] + '<span>' + STAMP_LABELS[key] + '</span></div>';
    }).join('');
  }
  function selectStamp(key) {
    _selectedStamp = key;
    renderStampPicker('stampPicker', _selectedStamp, 'selectStamp');
    document.getElementById('deliverField').style.display = key === 'slow' ? 'block' : 'none';
  }
  function selectEditStamp(key) {
    _editStamp = key;
    renderStampPicker('editStampPicker', _editStamp, 'selectEditStamp');
    document.getElementById('editDeliverField').style.display = key === 'slow' ? 'block' : 'none';
  }

  function renderMailFilterBar() {
    const opts = [
      { key:'all', label:'전체우편', icon:'' },
      { key:'express', label:'특급우편', icon:STAMP_ICONS.express },
      { key:'slow', label:'느린우편', icon:STAMP_ICONS.slow },
      { key:'intransit', label:'배달중', icon:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="#8f6fae" stroke-width="7"/><path d="M50 30 L50 52 L66 62" fill="none" stroke="#8f6fae" stroke-width="7" stroke-linecap="round"/></svg>' }
    ];
    document.getElementById('mailFilterBar').innerHTML = opts.map(function(o){
      return '<span class="mail-filter-chip' + (o.key===_mailFilter?' active':'') + '" onclick="selectMailFilter(\'' + o.key + '\')">' + o.icon + '<span>' + o.label + '</span></span>';
    }).join('');
  }
  function selectMailFilter(key) { _mailFilter = key; renderMailFilterBar(); renderLetters(); }

  function toLocalInputValue(dt) {
    // Date -> 'YYYY-MM-DDTHH:mm' (datetime-local 입력용)
    const p = function(n){ return String(n).padStart(2,'0'); };
    return dt.getFullYear() + '-' + p(dt.getMonth()+1) + '-' + p(dt.getDate()) + 'T' + p(dt.getHours()) + ':' + p(dt.getMinutes());
  }

  function openWriteModal() {
    document.getElementById('letterTitle').value = '';
    document.getElementById('letterContent').value = '';
    document.getElementById('writeErr').style.display = 'none';
    _selectedTheme = 'cream';
    renderThemePicker('themePicker', _selectedTheme, 'selectTheme');
    _selectedStamp = 'express';
    renderStampPicker('stampPicker', _selectedStamp, 'selectStamp');
    document.getElementById('deliverField').style.display = 'none';
    const soon = new Date(Date.now() + 24*60*60*1000);
    document.getElementById('deliverAtInput').value = toLocalInputValue(soon);
    document.getElementById('writeModal').style.display = 'flex';
  }
  function closeWriteModal() { document.getElementById('writeModal').style.display = 'none'; }

  async function submitLetter() {
    if (_isSubmitting) return;
    const title = document.getElementById('letterTitle').value.trim();
    const content = document.getElementById('letterContent').value.trim();
    const errEl = document.getElementById('writeErr');
    errEl.style.display = 'none';
    if (!content) { errEl.textContent = '내용을 적어주세요.'; errEl.style.display = 'block'; return; }

    let deliverAt = '';
    if (_selectedStamp === 'slow') {
      const raw = document.getElementById('deliverAtInput').value;
      if (!raw) { errEl.textContent = '배달 희망 일시를 선택해주세요.'; errEl.style.display = 'block'; return; }
      deliverAt = raw.replace('T', ' ');
    }

    _isSubmitting = true;
    const btn = document.getElementById('writeSubmitBtn');
    btn.disabled = true; btn.textContent = '게시 중입니다…';
    try {
      const res = await fetch(GAS_URL, {
        method:'POST',
        body: JSON.stringify({ action:'addLetter', letter:{ title: title || '제목 없음', content: content, theme: _selectedTheme, stampType: _selectedStamp, deliverAt: deliverAt } })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장 실패');
      _letters.unshift(data.letter);
      lsSave();
      renderLetters();
      closeWriteModal();
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      _isSubmitting = false;
      btn.disabled = false; btn.textContent = '보관하기';
    }
  }

  function isLocked(l) {
    if (l.stampType !== 'slow' || !l.deliverAt) return false;
    const target = new Date(String(l.deliverAt).replace(' ', 'T'));
    if (isNaN(target.getTime())) return false;
    return target.getTime() > Date.now();
  }

  function openReadModal(idx) {
    _activeIdx = idx;
    const l = _letters[idx];
    const locked = isLocked(l);

    document.getElementById('readStampBadge').innerHTML = STAMP_ICONS[l.stampType === 'slow' ? 'slow' : 'express'];
    document.getElementById('readTitle').textContent = locked ? '🔒 배달 중인 편지' : (l.title || '제목 없음');

    const contentEl = document.getElementById('readContent');
    if (locked) {
      contentEl.textContent = '아직 도착 전이에요. 편지지가 도착하면 그때 열어볼 수 있어요.';
    } else {
      contentEl.textContent = String(l.content || '');
    }
    contentEl.className = 'read-content theme-' + (l.theme || 'cream');

    const timeBlockEl = document.getElementById('readTimeBlock');
    if (l.stampType === 'slow') {
      timeBlockEl.innerHTML = '발송시간 : ' + (l.createdAt||'') + '<br>도착시간 : ' + (l.deliverAt||'') + (locked ? ' (아직 도착 전)' : '');
    } else {
      timeBlockEl.innerHTML = '발송시간 : ' + (l.createdAt||'') + '<br>도착시간 : ' + (l.deliverAt || l.createdAt || '');
    }

    document.getElementById('readView').style.display = 'block';
    document.getElementById('readEdit').style.display = 'none';
    document.getElementById('readModal').style.display = 'flex';
  }
  function closeReadModal() { document.getElementById('readModal').style.display = 'none'; _activeIdx = null; }

  function enterEditMode() {
    const l = _letters[_activeIdx];
    _editTheme = l.theme || 'cream';
    _editStamp = l.stampType === 'slow' ? 'slow' : 'express';
    document.getElementById('editTitle').value = l.title || '';
    document.getElementById('editContent').value = String(l.content || '');
    document.getElementById('editErr').style.display = 'none';
    renderThemePicker('editThemePicker', _editTheme, 'selectEditTheme');
    renderStampPicker('editStampPicker', _editStamp, 'selectEditStamp');
    document.getElementById('editDeliverField').style.display = _editStamp === 'slow' ? 'block' : 'none';
    if (l.deliverAt) {
      const d = new Date(String(l.deliverAt).replace(' ', 'T'));
      if (!isNaN(d.getTime())) document.getElementById('editDeliverAtInput').value = toLocalInputValue(d);
    }
    document.getElementById('readView').style.display = 'none';
    document.getElementById('readEdit').style.display = 'block';
  }
  function cancelEdit() {
    document.getElementById('readView').style.display = 'block';
    document.getElementById('readEdit').style.display = 'none';
  }

  async function submitEdit() {
    if (_isSubmitting) return;
    const l = _letters[_activeIdx];
    const title = document.getElementById('editTitle').value.trim();
    const content = document.getElementById('editContent').value.trim();
    const errEl = document.getElementById('editErr');
    errEl.style.display = 'none';
    if (!content) { errEl.textContent = '내용을 적어주세요.'; errEl.style.display = 'block'; return; }

    let deliverAt = l.deliverAt || '';
    if (_editStamp === 'slow') {
      const raw = document.getElementById('editDeliverAtInput').value;
      if (!raw) { errEl.textContent = '배달 희망 일시를 선택해주세요.'; errEl.style.display = 'block'; return; }
      deliverAt = raw.replace('T', ' ');
    } else {
      deliverAt = l.createdAt || '';
    }

    _isSubmitting = true;
    const btn = document.getElementById('editSubmitBtn');
    btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const patch = { title: title || '제목 없음', content: content, theme: _editTheme, stampType: _editStamp, deliverAt: deliverAt };
      const res = await fetch(GAS_URL, {
        method:'POST',
        body: JSON.stringify({ action:'updateLetter', id:l.id, patch: patch })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '수정 실패');
      Object.assign(l, patch);
      lsSave();
      renderLetters();
      closeReadModal();
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      _isSubmitting = false;
      btn.disabled = false; btn.textContent = '저장';
    }
  }

  async function deleteCurrentLetter() {
    if (_isSubmitting) return;
    if (!confirm('이 편지를 삭제할까요?')) return;
    const l = _letters[_activeIdx];
    _isSubmitting = true;
    try {
      const res = await fetch(GAS_URL, { method:'POST', body: JSON.stringify({ action:'deleteLetter', id:l.id }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '삭제 실패');
      _letters.splice(_activeIdx, 1);
      lsSave();
      renderLetters();
      closeReadModal();
    } catch(e) {
      alert('삭제 실패: ' + e.message);
    } finally {
      _isSubmitting = false;
    }
  }

  function renderLetters() {
    const grid = document.getElementById('lettersGrid');
    const filtered = _letters.filter(function(l){
      const stampKey = l.stampType === 'slow' ? 'slow' : 'express';
      const locked = isLocked(l);
      if (_mailFilter === 'all') return true;
      if (_mailFilter === 'express') return stampKey === 'express';
      if (_mailFilter === 'slow') return stampKey === 'slow' && !locked;      // 배달 완료된 느린우편만
      if (_mailFilter === 'intransit') return stampKey === 'slow' && locked; // 배달 중인 것만
      return true;
    });

    if (!filtered.length) {
      const emptyMsgMap = {
        all: '아직 남긴 편지가 없어요. 첫 편지를 써볼까요?',
        express: '특급우편이 아직 없어요.',
        slow: '배달 완료된 느린우편이 아직 없어요.',
        intransit: '지금 배달 중인 편지가 없어요.'
      };
      grid.innerHTML = '<div class="empty-note" style="grid-column:1/-1;">' + (emptyMsgMap[_mailFilter] || '해당하는 편지가 없어요.') + '</div>';
      return;
    }

    grid.innerHTML = filtered.map(function(l){
      const i = _letters.indexOf(l);
      const locked = isLocked(l);
      const stampKey = l.stampType === 'slow' ? 'slow' : 'express';
      const badge = '<div class="stamp-badge-corner">' + STAMP_ICONS[stampKey] + '</div>';

      if (IS_GUEST) {
        // 게스트는 제목/일시/내용 전부 모자이크, 클릭해도 안 열림
        return '<div class="letter-card theme-' + (l.theme||'cream') + '" onclick="event.preventDefault();" style="cursor:default;">' +
          badge +
          '<div class="letter-title mosaic">' + (l.title || '제목 없음') + '</div>' +
          '<div class="letter-preview mosaic">' + String(l.content||'').slice(0,180) + '</div>' +
          '<div class="letter-date mosaic">' + (l.createdAt||'') + '</div>' +
        '</div>';
      }

      if (locked) {
        const preview = String(l.content || '').slice(0, 180);
        return '<div class="letter-card theme-' + (l.theme||'cream') + ' locked" onclick="openReadModal(' + i + ')">' +
          badge +
          '<div class="letter-title">' + (l.title || '제목 없음') + '</div>' +
          '<div class="letter-preview mosaic">' + preview + '</div>' +
          '<div class="locked-note">발송일시 : ' + (l.createdAt||'') + '<br>배달예정일시 : ' + (l.deliverAt||'') + '</div>' +
        '</div>';
      }

      const preview = String(l.content || '').slice(0, 180);
      const dateBlock = stampKey === 'slow'
        ? '<div class="letter-date">발송일시 : ' + (l.createdAt || '') + '<br>도착일시 : ' + (l.deliverAt || '') + '</div>'
        : '<div class="letter-date">' + (l.createdAt || '') + '</div>';
      return '<div class="letter-card theme-' + (l.theme||'cream') + '" onclick="openReadModal(' + i + ')">' +
        badge +
        '<div class="letter-title">' + (l.title || '제목 없음') + '</div>' +
        '<div class="letter-preview">' + preview + (String(l.content||'').length > 180 ? '…' : '') + '</div>' +
        dateBlock +
      '</div>';
    }).join('');
  }

  async function init() {
    const cached = lsLoad();
    if (cached && Array.isArray(cached.letters)) {
      _letters = cached.letters;
      document.getElementById('gasBadge').textContent = '📦 캐시에서 표시 중 (갱신 중…)';
      renderMailFilterBar();
      renderLetters();
    } else {
      document.getElementById('gasBadge').textContent = '불러오는 중…';
    }
    try {
      const data = await gasGet('listLetters');
      if (!data.ok) throw new Error(data.error || 'GAS 응답 오류');
      _letters = (data.letters || []).reverse();
      lsSave();
      document.getElementById('gasBadge').textContent = '✅ GAS 연동됨';
    } catch(e) {
      document.getElementById('gasBadge').textContent = cached ? '⚠️ 갱신 실패 (캐시 표시 중)' : '⚠️ GAS 응답 실패';
      console.warn('[편지함] 로드 실패:', e.message);
    }
    renderMailFilterBar();
    renderLetters();

    const openId = new URLSearchParams(location.search).get('open');
    if (openId) {
      const idx = _letters.findIndex(function(l){ return l.id === openId; });
      if (idx !== -1) openReadModal(idx);
    }
  }

  const today = new Date();
  document.getElementById('todayLine').textContent =
    today.getFullYear() + '. ' + String(today.getMonth()+1).padStart(2,'0') + '. ' + String(today.getDate()).padStart(2,'0');

  init();
(function(){
  var sidebar = document.getElementById('rpSidebar');
  var backdrop = document.getElementById('sidebarBackdrop');
  if (!sidebar) return;
  window.toggleSidebar = function(){
    var open = sidebar.classList.toggle('expanded');
    if (backdrop) backdrop.classList.toggle('show', open);
  };
  if (backdrop) backdrop.addEventListener('click', function(){
    sidebar.classList.remove('expanded');
    backdrop.classList.remove('show');
  });
})();
</script>

</body>
</html>
